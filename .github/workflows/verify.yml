name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: supaflow
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: supaflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supaflow -d supaflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SUPAFLOW_TEST_DATABASE_URL: postgres://supaflow:ci-only-password@127.0.0.1:5432/supaflow_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run build
      - run: go run ./cmd/generate-node-contract
      - run: git diff --exit-code -- contracts/schemas/builtin-node-types-v1.json
      # Integration packages share this disposable database, so package-level
      # parallelism is disabled while concurrency inside each test remains real.
      - run: go test -p 1 ./... -count=1 -timeout=10m
      - run: go test -p 1 -race ./... -count=1 -timeout=15m
      - run: go vet ./...
      - run: go build ./cmd/...
      - run: go mod tidy -diff
