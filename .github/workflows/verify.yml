name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: supaflow
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: supaflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supaflow -d supaflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Integration suites are not idempotent against one database: they leave
      # hard-coded rows such as outbox_messages 'clock-message' behind, so a
      # second pass over the same database fails on duplicate keys. Each
      # database below carries exactly one pass of the suite.
      SUPAFLOW_TEST_DATABASE_URL: postgres://supaflow:ci-only-password@127.0.0.1:5432/supaflow_ci?sslmode=disable
      SUPAFLOW_RACE_DATABASE_URL: postgres://supaflow:ci-only-password@127.0.0.1:5432/supaflow_ci_race?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run build
      - run: go run ./cmd/generate-node-contract
      - run: git diff --exit-code -- contracts/schemas/builtin-node-types-v1.json
      - name: Create the race database
        run: psql "$SUPAFLOW_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE supaflow_ci_race'
      # The 1,000-client PostgreSQL profile is excluded here: it needs a
      # dedicated run, and its simultaneous clients distort unit-test timing.
      # Run it through .github/workflows/pressure.yml instead.
      - run: go test -p 1 ./... -count=1 -timeout=15m -skip '^TestPostgresControlPlanePressure$'
      - run: go test -p 1 -race ./... -count=1 -timeout=30m -skip '^TestPostgresControlPlanePressure$'
        env:
          SUPAFLOW_TEST_DATABASE_URL: ${{ env.SUPAFLOW_RACE_DATABASE_URL }}
      - run: go vet ./...
      - run: go build ./cmd/...
      - run: go mod tidy -diff
