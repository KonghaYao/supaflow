services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: supaflow
      POSTGRES_USER: supaflow
      POSTGRES_PASSWORD: local-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supaflow -d supaflow"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - supaflow-postgres:/var/lib/postgresql/data

volumes:
  supaflow-postgres:
